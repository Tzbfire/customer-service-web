[project]
name = "merchant-service-web"
version = "0.1.0"
description = "Multi-user merchant support desk with document-grounded AI replies"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "cryptography>=44", "websockets>=14,<16",
  "pymupdf>=1.25", "python-docx>=1.1", "openpyxl>=3.1", "Pillow>=11",
  "jieba>=0.42.1", "playwright>=1.52,<2"
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
